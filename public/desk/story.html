<!doctype html>
<!-- One story template, four looks. The data comes in as window.STORY (or ?d=<base64 JSON>).
     Fields: type (poll|transform|problem|offer), brand ({name, phones[], color, accent}), branch,
     photo, photo2 (transform "after"), title, sub, options[] (poll), before/after labels. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Hind;src:url(story-assets/hind-700.woff2);font-weight:700}
@font-face{font-family:Hind;src:url(story-assets/hind-600.woff2);font-weight:600}
@font-face{font-family:Anton;src:url(story-assets/anton.woff2)}
:root{--c:#0b6e75;--a:#ffd166;--d:#071a20;--r:#ff4d2e}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;font-family:Hind;background:var(--d);position:relative;color:#fff}
.ph{position:absolute;inset:0;background-size:cover;background-position:center}
.brand{position:absolute;left:0;right:0;bottom:280px;text-align:center;font-size:38px;font-weight:600;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.fade{position:absolute;left:0;right:0;bottom:0;height:700px;background:linear-gradient(transparent,rgba(5,15,20,.85))}
.brand b{color:var(--a)}
.brand .tel{display:inline-block;margin-top:10px;background:#fff;color:var(--d);font-size:46px;font-weight:700;padding:2px 30px;border-radius:40px}
.tag{display:inline-block;background:var(--a);color:var(--d);font-size:38px;font-weight:700;padding:2px 26px;border-radius:30px}

/* POLL: photo in a tilted card, question on a coloured block, two big answer bars */
.poll{background:linear-gradient(160deg,var(--c),var(--d) 70%)}
.poll .card{position:absolute;left:170px;top:300px;width:740px;height:640px;border-radius:40px;overflow:hidden;transform:rotate(-3deg);border:10px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.5)}
.poll .card .ph{background-position:50% 30%}
.poll .q{position:absolute;left:60px;right:60px;top:900px;background:#fff;color:var(--d);border-radius:36px;padding:34px 40px 30px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.poll .q h1{font-size:68px;line-height:1.2;text-align:center}
.poll .opt{margin-top:22px;display:flex;align-items:center;gap:20px;border:5px solid var(--c);border-radius:24px;padding:10px 26px;font-size:50px;font-weight:700}
.poll .opt i{font-style:normal;width:62px;height:62px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:36px}
.poll .hint{text-align:center;margin-top:20px;font-size:36px;color:#557;font-weight:600}
.poll .top{position:absolute;top:210px;left:0;right:0;text-align:center}

/* TRANSFORM: split screen with a diagonal seam, labels on each half */
.tr .half{position:absolute;left:0;right:0;overflow:hidden}
.tr .h1{top:0;height:960px;clip-path:polygon(0 0,100% 0,100% 88%,0 100%)}
.tr .h2{top:840px;height:1080px;clip-path:polygon(0 12%,100% 0,100% 100%,0 100%)}
.tr .h1 .ph{filter:grayscale(.85) brightness(.75)}
.tr .lab{position:absolute;left:50px;font-size:64px;font-weight:700;padding:4px 30px;border-radius:18px}
.tr .l1{top:240px;background:rgba(0,0,0,.65);color:#fff}
.tr .l2{top:1120px;background:var(--a);color:var(--d)}
.tr .arrow{position:absolute;right:70px;top:800px;width:190px;height:190px;border-radius:50%;background:var(--r);display:flex;align-items:center;justify-content:center;font-size:120px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.tr .head{position:absolute;left:40px;right:40px;top:1240px;font-size:76px;line-height:1.15;background:rgba(5,15,20,.72);padding:14px 30px;border-radius:24px}


/* PROBLEM: dark top with the problem crossed out, photo below with the answer */
.pb .ph{top:760px;background-position:50% 35%}
.pb .shade{position:absolute;left:0;right:0;top:760px;height:300px;background:linear-gradient(var(--d),transparent)}
.pb .prob{position:absolute;left:60px;right:60px;top:250px;font-size:74px;line-height:1.2;color:#ffb4a8}
.pb .prob s{text-decoration-color:var(--r);text-decoration-thickness:10px}
.pb .sol{position:absolute;left:60px;right:60px;top:560px;font-size:96px;line-height:1.05;color:var(--a)}
.pb .badge{position:absolute;left:60px;top:1220px;background:var(--r);color:#fff;font-size:52px;font-weight:700;padding:4px 30px;border-radius:16px;transform:rotate(-2deg)}

/* OFFER: full photo, big price ticket */
.of .ph{filter:brightness(.85)}
.of .grad{position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(7,26,32,.92) 70%)}
.of .ticket{position:absolute;left:90px;right:90px;top:960px;background:var(--a);color:var(--d);border-radius:30px;padding:30px 40px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.5)}
.of .ticket::before,.of .ticket::after{content:"";position:absolute;top:50%;width:70px;height:70px;margin-top:-35px;border-radius:50%;background:var(--d)}
.of .ticket::before{left:-35px}.of .ticket::after{right:-35px}
.of .ticket small{display:block;font-size:44px;font-weight:600}
.of .ticket b{display:block;font-size:150px;line-height:1.05}
.of .ticket span{display:block;font-size:44px;font-weight:600}
.of .top{position:absolute;top:220px;left:60px;right:60px}
.of .top h1{font-size:88px;line-height:1.1;text-shadow:0 6px 30px rgba(0,0,0,.8)}

/* TIP: photo on top, numbered tip card below */
.tp .ph{height:1240px;bottom:auto;background-position:50% 40%}
.tp .card{position:absolute;left:50px;right:50px;top:1120px;background:#fff;color:var(--d);border-radius:36px;padding:40px 44px 36px;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.tp .card .tag{position:absolute;top:-34px;left:44px;font-size:42px}
.tp .card h1{font-size:66px;line-height:1.25}
/* CLIP: transparent overlay for a video story */
body.clip{background:transparent}
.cl .top{position:absolute;left:50px;right:50px;top:240px}
.cl .top h1{display:inline;font-size:72px;line-height:1.35;background:rgba(5,15,20,.78);box-decoration-break:clone;-webkit-box-decoration-break:clone;padding:4px 22px;border-radius:14px}
.cl .fade{height:520px}
</style></head><body>
<div id="app"></div>
<script>
const D = window.STORY || JSON.parse(decodeURIComponent(escape(atob(new URLSearchParams(location.search).get('d') || 'e30='))));
const B = D.brand || {};
if (B.color) document.documentElement.style.setProperty('--c', B.color);
if (B.accent) document.documentElement.style.setProperty('--a', B.accent);
const esc = s => String(s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const brand = `<div class="fade"></div><div class="brand"><b>${esc(B.name)}</b>${D.branch ? ' · ' + esc(D.branch) : ''}<br><span class="tel">📞 ${esc((B.phones || []).join(' · '))}</span></div>`;
const ph = (u, extra = '') => `<div class="ph" style="background-image:url('${u}');${extra}"></div>`;
const V = {
  poll: () => `<div class="poll" style="position:absolute;inset:0">
      <div class="top"><span class="tag">${esc(D.kicker || 'আপনার মত?')}</span></div>
      <div class="card">${ph(D.photo)}</div>
      <div class="q"><h1>${esc(D.title)}</h1>
        ${(D.options || []).map((o, i) => `<div class="opt"><i>${'AB'[i]}</i>${esc(o)}</div>`).join('')}
        <div class="hint">${esc(D.sub || 'কমেন্টে A বা B লিখুন 👇')}</div></div>${brand}</div>`,
  transform: () => `<div class="tr" style="position:absolute;inset:0">
      <div class="half h1">${ph(D.photo)}</div><div class="half h2">${ph(D.photo2)}</div>
      <div class="lab l1">${esc(D.before || 'আগে')}</div><div class="lab l2">${esc(D.after || 'এখন')}</div>
      <div class="arrow">➜</div><div class="head">${esc(D.title)}</div>${brand}</div>`,
  problem: () => `<div class="pb" style="position:absolute;inset:0">${ph(D.photo)}<div class="shade"></div>
      <div class="prob"><s>${esc(D.problem)}</s></div><div class="sol">${esc(D.title)}</div>
      <div class="badge">${esc(D.sub)}</div>${brand}</div>`,
  tip: () => `<div class="tp" style="position:absolute;inset:0">${ph(D.photo)}
      <div class="card"><span class="tag">${esc(D.kicker || 'টিপস')}</span><h1>${esc(D.title)}</h1></div>${brand}</div>`,
  clip: () => `<div class="cl" style="position:absolute;inset:0"><div class="top">${D.kicker ? `<span class="tag">${esc(D.kicker)}</span><br><br>` : ''}<h1>${esc(D.title || D.problem)}</h1></div>${brand}</div>`,
  offer: () => `<div class="of" style="position:absolute;inset:0">${ph(D.photo)}<div class="grad"></div>
      <div class="top"><span class="tag">${esc(D.kicker)}</span><h1 style="margin-top:24px">${esc(D.title)}</h1></div>
      <div class="ticket"><small>${esc(D.pre)}</small><b>${esc(D.price)}</b><span>${esc(D.sub)}</span></div>${brand}</div>`,
};
if (D.type === 'clip') document.body.classList.add('clip');
document.getElementById('app').innerHTML = (V[D.type] || V.offer)();
</script></body></html>
